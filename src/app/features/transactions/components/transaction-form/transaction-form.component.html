<h2 mat-dialog-title>Registrar Nueva Transacción</h2>

<mat-dialog-content>
  <form [formGroup]="transactionForm" (ngSubmit)="onSubmit()">
    <mat-form-field appearance="fill">
      <mat-label>Monto</mat-label>
      <input matInput type="number" formControlName="amount" placeholder="Ingrese el monto">
      <mat-error *ngIf="amount?.invalid && (amount?.dirty || amount?.touched)">
        <span *ngIf="amount?.errors?.['required']">El monto es requerido.</span>
        <span *ngIf="amount?.errors?.['min']">El monto debe ser mayor a 0.</span>
      </mat-error>
    </mat-form-field>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()">Cancelar</button>
  <button mat-raised-button color="primary" (click)="onSubmit()" [disabled]="transactionForm.invalid">Registrar</button>
</mat-dialog-actions>
